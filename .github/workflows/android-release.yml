name: Android CI & GitHub Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release optionnel (ex: v1.0.0) pour publier sur GitHub Releases'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare release signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 secret not set; generating temporary CI upload keystore."
            TEMP_PASS="mkulimapay-ci-temp"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/my-upload-key.jks" \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Mkulima Pay CI, O=MkulimaPay, C=CD"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs and Release AAB
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/mkulima-pay-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/mkulima-pay-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/mkulima-pay-release.aab

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mkulima-pay-builds
          path: dist/

      - name: Determine release tag
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Mkulima Pay ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/mkulima-pay-release.apk
            dist/mkulima-pay-release.aab
            dist/mkulima-pay-debug.apk
